[project]
name = "delivery-time-prediction"
version = "1.0.0"
description = "A modular, production-style ML pipeline that predicts food delivery times."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mohaiminul Islam", email = "imniloy11@gmail.com" }]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "pyyaml>=6.0",
    "scikit-learn>=1.2",
    "streamlit>=1.28",
    "xgboost>=1.7",
]

[dependency-groups]
dev = ["pytest>=7.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
